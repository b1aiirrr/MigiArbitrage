# ─────────────────────────────────────────────────
# MigiArbitrage — Docker Compose
# Memory-limited for 2GB RAM Ubuntu VPS
# ─────────────────────────────────────────────────
version: "3.8"

services:
  migi-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: migi-arbitrage
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file:
      - ../.env
    deploy:
      resources:
        limits:
          memory: 1800M
          cpus: "0.9"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "python", "-c", "import asyncio, websockets; asyncio.run(websockets.connect('ws://localhost:8765'))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
