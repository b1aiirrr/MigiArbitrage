<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#007cf0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0a0e17"/>
  <!-- Graph line -->
  <polyline points="4,24 9,18 14,21 19,10 24,14 28,6"
    stroke="url(#fg)" stroke-width="2.5" stroke-linecap="round"
    stroke-linejoin="round" fill="none"/>
  <!-- Nodes -->
  <circle cx="4" cy="24" r="2" fill="#00f0ff" opacity="0.7"/>
  <circle cx="14" cy="21" r="1.5" fill="#00f0ff" opacity="0.6"/>
  <circle cx="19" cy="10" r="2" fill="#00f0ff" opacity="0.8"/>
  <circle cx="28" cy="6" r="2.5" fill="#00f0ff"/>
  <!-- Diamond at peak -->
  <polygon points="28,3 30.5,6 28,9 25.5,6"
    fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.6"/>
</svg>
