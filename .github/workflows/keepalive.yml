name: Keep Azure Backend Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: # allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Azure Health Endpoint
        run: curl -I -X GET https://migiarbitrage-api-onpgl.azurewebsites.net/health
